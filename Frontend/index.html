<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0d0b" media="(prefers-color-scheme: dark)" />
    <title>Developer Portfolio</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Personal developer portfolio: professional projects, skills and experience." />

    <!-- Static share card. useSeo.js refines these per route once JavaScript
         runs; these values are what a crawler that does not run it will read,
         so they must stand on their own. -->
    <meta property="og:site_name" content="Developer Portfolio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Developer Portfolio" />
    <meta property="og:description" content="Professional project archive: client platforms, admin panels and long-running product work." />
    <meta property="og:url" content="https://piyush250-portfolio24.vercel.app/" />
    <meta property="og:image" content="https://piyush250-portfolio24.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Developer Portfolio" />
    <meta name="twitter:description" content="Professional project archive: client platforms, admin panels and long-running product work." />
    <meta name="twitter:image" content="https://piyush250-portfolio24.vercel.app/og-image.png" />
    <link rel="canonical" href="https://piyush250-portfolio24.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
